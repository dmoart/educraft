<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  
  <!-- Icon: gear + book -->
  <g transform="translate(60, 40)">
    <!-- Book -->
    <rect x="20" y="20" width="50" height="65" rx="4" fill="#e94560" opacity="0.9"/>
    <rect x="22" y="22" width="46" height="61" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/>
    <line x1="35" y1="35" x2="55" y2="35" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="45" x2="55" y2="45" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="55" x2="50" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Gear -->
    <circle cx="55" cy="60" r="22" fill="none" stroke="#f5a623" stroke-width="3"/>
    <circle cx="55" cy="60" r="8" fill="#f5a623"/>
    <line x1="55" y1="35" x2="55" y2="38" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="82" x2="55" y2="85" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="60" x2="33" y2="60" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="60" x2="80" y2="60" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Title -->
  <text x="140" y="80" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#fff">EduCraft</text>
  <text x="140" y="110" font-family="system-ui, sans-serif" font-size="16" fill="#a0a0b0" letter-spacing="2">SKILL PARA OPENCODE</text>
  
  <!-- Tagline -->
  <rect x="140" y="125" width="440" height="1" fill="#e94560" opacity="0.5"/>
  <text x="140" y="148" font-family="system-ui, sans-serif" font-size="15" fill="#c0c0d0">
    Formulación de proyectos educativos STEAM con IA
  </text>
  <text x="140" y="170" font-family="system-ui, sans-serif" font-size="13" fill="#808090">
    ABP · MCN 2022 · Robótica · Programación · Espacios Maker
  </text>
</svg>
